name: Build Parking Escape Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/parking-sdk-20261024

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify selected dependencies
        run: |
          mkdir -p qa
          gradle verifyFragmentDependency
          gradle :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency androidx.fragment:fragment > qa/fragment-dependency.txt
          gradle :app:dependencies --configuration releaseRuntimeClasspath > qa/release-dependencies.txt

      - name: Android checks
        run: gradle testDebugUnitTest lintRelease

      - name: Build APK
        run: gradle assembleDebug

      - name: Build release AAB
        run: gradle bundleRelease

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PARKING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parking-escape-upload.jks"
          test -s "$RUNNER_TEMP/parking-escape-upload.jks"

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PARKING_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PARKING_KEYSTORE_PASSWORD }}
        run: |
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/parking-escape-upload.jks" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            app/build/outputs/bundle/release/app-release.aab \
            upload
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parking-escape-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Parking-Escape-Google-Play-package
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Parking-Escape-1.0.1-verification
          path: |
            qa/
            app/build/reports/
